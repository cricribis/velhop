<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Velhop">
<meta name="theme-color" content="#1a4a2e">
<title>Velhop — Stations</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root {
    --green-dark: #1a4a2e;
    --green-mid: #2d7a4f;
    --amber: #f5a623;
    --red: #e24b4a;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --surface: #ffffff;
    --surface2: #f4f6f4;
    --border: rgba(0,0,0,0.1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --green-dark: #2d7a4f;
      --green-mid: #4caf80;
      --text: #f0f0f0;
      --text-muted: #9ca3af;
      --surface: #1c1c1e;
      --surface2: #2c2c2e;
      --border: rgba(255,255,255,0.1);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background: var(--surface2); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  header {
    background: var(--green-dark); color: #fff; flex-shrink: 0;
    padding: calc(var(--safe-top) + 12px) 16px 12px;
    z-index: 100;
  }
  .header-inner { display: flex; align-items: center; gap: 10px; max-width: 600px; margin: 0 auto; }
  .header-title h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header-title p { font-size: 11px; opacity: 0.7; margin-top: 1px; }
  .refresh-btn {
    margin-left: auto; background: rgba(255,255,255,0.15); border: none;
    border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    color: #fff; cursor: pointer; font-size: 17px;
  }
  .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .summary-bar {
    background: var(--green-mid); color: #fff; flex-shrink: 0;
    padding: 8px 16px; display: flex; gap: 16px; justify-content: center; font-size: 12px;
  }
  .summary-bar strong { font-weight: 700; font-size: 15px; display: block; }
  .summary-bar span { opacity: 0.8; font-size: 10px; }

  /* Nav tabs */
  .nav-tabs { display: flex; background: var(--surface); border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
  .nav-tab {
    flex: 1; padding: 10px 4px; border: none; background: transparent;
    color: var(--text-muted); font-size: 12px; font-weight: 500; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .nav-tab .nav-icon { font-size: 18px; }
  .nav-tab.active { color: var(--green-mid); border-bottom-color: var(--green-mid); }

  /* Views */
  .view { flex: 1; overflow: hidden; display: none; flex-direction: column; }
  .view.active { display: flex; }

  /* MAP */
  #map { flex: 1; }
  .leaflet-container { background: #e8f0e8; }

  /* LIST */
  .list-controls {
    background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 10px 12px; flex-shrink: 0;
  }
  .search-wrap { position: relative; max-width: 600px; margin: 0 auto 8px; }
  .search-wrap input {
    width: 100%; padding: 9px 12px 9px 34px;
    border: 0.5px solid var(--border); border-radius: 10px;
    background: var(--surface2); color: var(--text); font-size: 15px; outline: none;
  }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--text-muted); pointer-events: none; }
  .filter-tabs { display: flex; gap: 6px; max-width: 600px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .ftab { padding: 5px 11px; border: 0.5px solid var(--border); border-radius: 20px; background: var(--surface2); color: var(--text-muted); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .ftab.active { background: var(--green-dark); color: #fff; border-color: var(--green-dark); }

  .list-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .list { max-width: 600px; margin: 0 auto; padding: 10px 12px calc(var(--safe-bottom) + 20px); display: flex; flex-direction: column; gap: 8px; }

  .station-card {
    background: var(--surface); border-radius: 14px; padding: 13px 14px;
    border: 0.5px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer;
  }
  .station-card:active { opacity: 0.8; }
  .avail-ring { flex-shrink: 0; width: 50px; height: 50px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .avail-ring svg { position: absolute; top: 0; left: 0; }
  .avail-ring .count { font-size: 17px; font-weight: 700; position: relative; z-index: 1; line-height: 1; }
  .avail-ring .rlbl { font-size: 8px; color: var(--text-muted); position: relative; z-index: 1; text-transform: uppercase; }
  .station-info { flex: 1; min-width: 0; }
  .station-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .station-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }
  .pill { display: inline-flex; padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .pill-green { background: #e8f5ee; color: #1a6b3c; }
  .pill-amber { background: #fef3e2; color: #b45309; }
  .pill-red   { background: #fce8e8; color: #991b1b; }
  @media (prefers-color-scheme: dark) {
    .pill-green { background: #0f2a1a; color: #7dd5a8; }
    .pill-amber { background: #2a1a00; color: #fbbf24; }
    .pill-red   { background: #2a0f0f; color: #f87171; }
  }
  .station-right { flex-shrink: 0; text-align: right; }
  .docks-num { font-size: 17px; font-weight: 700; color: var(--amber); display: block; }
  .docks-lbl { font-size: 10px; color: var(--text-muted); }

  .loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 60px 20px; color: var(--text-muted); font-size: 15px; }
  .dot-pulse span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green-mid); animation: pulse 1.2s ease-in-out infinite; margin: 0 2px; }
  .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
  .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }
  .empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .timestamp { text-align: center; font-size: 11px; color: var(--text-muted); padding: 8px 0 0; }

  /* Detail sheet */
  .detail-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .detail-overlay.open { opacity: 1; pointer-events: all; }
  .detail-sheet { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 20px calc(var(--safe-bottom) + 24px); width: 100%; max-width: 600px; margin: 0 auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
  .detail-overlay.open .detail-sheet { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 3px; }
  .sheet-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
  .sheet-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-box { background: var(--surface2); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-box .val { font-size: 26px; font-weight: 700; }
  .stat-box .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .close-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--green-dark); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }

  /* Custom map markers */
  .map-marker {
    width: 36px; height: 36px; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg); border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .map-marker span { transform: rotate(45deg); font-size: 12px; font-weight: 700; color: #fff; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <span style="font-size:24px">🚲</span>
    <div class="header-title">
      <h1>Velhop Strasbourg</h1>
      <p>Disponibilités en temps réel</p>
    </div>
    <button class="refresh-btn" id="refreshBtn" aria-label="Actualiser">↻</button>
  </div>
</header>

<div class="summary-bar" id="summaryBar" style="display:none">
  <div><strong id="sumBikes">—</strong><span>vélos dispo.</span></div>
  <div><strong id="sumDocks">—</strong><span>places libres</span></div>
  <div><strong id="sumStations">—</strong><span>stations</span></div>
</div>

<div class="nav-tabs">
  <button class="nav-tab active" data-view="map">
    <span class="nav-icon">🗺️</span>Carte
  </button>
  <button class="nav-tab" data-view="list">
    <span class="nav-icon">📋</span>Liste
  </button>
</div>

<!-- MAP VIEW -->
<div class="view active" id="view-map">
  <div id="map"></div>
</div>

<!-- LIST VIEW -->
<div class="view" id="view-list">
  <div class="list-controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Rechercher une station…">
    </div>
    <div class="filter-tabs">
      <button class="ftab active" data-filter="all">Toutes</button>
      <button class="ftab" data-filter="available">Vélos dispo.</button>
      <button class="ftab" data-filter="docks">Places libres</button>
      <button class="ftab" data-filter="empty">Vides</button>
    </div>
  </div>
  <div class="list-scroll">
    <div id="listContainer">
      <div class="loading"><div class="dot-pulse"><span></span><span></span><span></span></div> Chargement…</div>
    </div>
  </div>
</div>

<!-- DETAIL SHEET -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetName"></div>
    <div class="sheet-sub" id="sheetSub"></div>
    <div class="sheet-stats">
      <div class="stat-box"><div class="val" id="sheetBikes" style="color:var(--green-mid)">—</div><div class="lbl">🚲 Vélos</div></div>
      <div class="stat-box"><div class="val" id="sheetDocks" style="color:var(--amber)">—</div><div class="lbl">🅿️ Places</div></div>
      <div class="stat-box"><div class="val" id="sheetTotal">—</div><div class="lbl">📍 Capacité</div></div>
    </div>
    <button class="close-btn" id="closeSheet">Fermer</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STATUS_URL = 'https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_ae/fr/station_status.json';
const INFO_URL   = 'https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_ae/fr/station_information.json';

let stations = [];
let activeFilter = 'all';
let searchQuery  = '';
let lastUpdate   = null;
let mapMarkers   = [];
let leafletMap   = null;

// ── Init map ──────────────────────────────────────────────────────────────────
function initMap() {
  leafletMap = L.map('map', { zoomControl: true, attributionControl: true })
    .setView([48.5834, 7.7454], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  }).addTo(leafletMap);
}

// ── Marker helpers ────────────────────────────────────────────────────────────
function markerColor(bikes, capacity) {
  if (!capacity) return '#888';
  const r = bikes / capacity;
  if (r >= 0.4) return '#2d7a4f';
  if (r > 0)    return '#f5a623';
  return '#e24b4a';
}

function makeIcon(bikes, capacity) {
  const color = markerColor(bikes, capacity);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="42" viewBox="0 0 36 42">
    <path d="M18 0C8.06 0 0 8.06 0 18c0 13.5 18 24 18 24S36 31.5 36 18C36 8.06 27.94 0 18 0z" fill="${color}" stroke="white" stroke-width="2"/>
    <text x="18" y="23" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="white">${bikes}</text>
  </svg>`;
  return L.divIcon({
    html: svg,
    iconSize: [36, 42],
    iconAnchor: [18, 42],
    popupAnchor: [0, -44],
    className: '',
  });
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function fetchStations() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  try {
    const [sRes, iRes] = await Promise.all([fetch(STATUS_URL), fetch(INFO_URL)]);
    const sData = await sRes.json();
    const iData = await iRes.json();

    const infoMap = {};
    for (const s of iData.data.stations) infoMap[s.station_id] = s;

    stations = sData.data.stations.map(s => {
      const info = infoMap[s.station_id] || {};
      return {
        id:        s.station_id,
        name:      info.name || 'Station ' + s.station_id,
        shortName: info.short_name || '',
        capacity:  info.capacity || (s.num_bikes_available + s.num_docks_available),
        bikes:     s.num_bikes_available,
        docks:     s.num_docks_available,
        lat:       info.lat,
        lon:       info.lon,
      };
    }).sort((a, b) => a.name.localeCompare(b.name, 'fr'));

    lastUpdate = new Date();
    updateSummary();
    updateMap();
    renderList();
  } catch(e) {
    document.getElementById('listContainer').innerHTML =
      `<div class="empty">⚠️ Impossible de charger les données.<br>Vérifiez votre connexion.</div>`;
  }
  btn.classList.remove('spinning');
}

// ── Summary ───────────────────────────────────────────────────────────────────
function updateSummary() {
  document.getElementById('sumBikes').textContent    = stations.reduce((s,x) => s + x.bikes, 0);
  document.getElementById('sumDocks').textContent    = stations.reduce((s,x) => s + x.docks, 0);
  document.getElementById('sumStations').textContent = stations.length;
  document.getElementById('summaryBar').style.display = 'flex';
}

// ── Map markers ───────────────────────────────────────────────────────────────
function updateMap() {
  mapMarkers.forEach(m => m.remove());
  mapMarkers = [];
  stations.forEach(s => {
    if (!s.lat || !s.lon) return;
    const marker = L.marker([s.lat, s.lon], { icon: makeIcon(s.bikes, s.capacity) })
      .addTo(leafletMap)
      .on('click', () => openDetail(s));
    mapMarkers.push(marker);
  });
}

// ── List ──────────────────────────────────────────────────────────────────────
function filtered() {
  let list = stations;
  if (searchQuery) { const q = searchQuery.toLowerCase(); list = list.filter(s => s.name.toLowerCase().includes(q)); }
  if (activeFilter === 'available') list = list.filter(s => s.bikes > 0);
  if (activeFilter === 'docks')     list = list.filter(s => s.docks > 0);
  if (activeFilter === 'empty')     list = list.filter(s => s.bikes === 0);
  return list;
}

function pill(bikes, docks) {
  if (bikes === 0) return `<span class="pill pill-red">Vide</span>`;
  if (bikes <= 2)  return `<span class="pill pill-amber">Peu de vélos</span>`;
  if (docks === 0) return `<span class="pill pill-amber">Complet</span>`;
  return `<span class="pill pill-green">Disponible</span>`;
}

function renderList() {
  const list = filtered();
  const container = document.getElementById('listContainer');
  if (!list.length) { container.innerHTML = `<div class="empty">🔍 Aucune station trouvée.</div>`; return; }

  const circ = 2 * Math.PI * 22;
  const cards = list.map((s) => {
    const color = markerColor(s.bikes, s.capacity);
    const pct   = s.capacity > 0 ? (s.bikes / s.capacity) * 100 : 0;
    const dash  = (pct / 100) * circ;
    return `<div class="station-card" onclick='openDetail(${JSON.stringify(s)})'>
      <div class="avail-ring">
        <svg width="50" height="50" viewBox="0 0 50 50" aria-hidden="true">
          <circle cx="25" cy="25" r="22" fill="none" stroke="var(--border)" stroke-width="4"/>
          <circle cx="25" cy="25" r="22" fill="none" stroke="${color}" stroke-width="4"
            stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 25 25)"/>
        </svg>
        <span class="count" style="color:${color}">${s.bikes}</span>
        <span class="rlbl">vélos</span>
      </div>
      <div class="station-info">
        <div class="station-name">${s.name}</div>
        <div class="station-meta">${pill(s.bikes, s.docks)}<span>${s.capacity > 0 ? Math.round(pct)+'%' : ''}</span></div>
      </div>
      <div class="station-right">
        <span class="docks-num">${s.docks}</span>
        <span class="docks-lbl">places</span>
      </div>
    </div>`;
  }).join('');

  const ts = lastUpdate ? `<div class="timestamp">Mis à jour à ${lastUpdate.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>` : '';
  container.innerHTML = `<div class="list">${cards}${ts}</div>`;
}

// ── Detail sheet ──────────────────────────────────────────────────────────────
function openDetail(s) {
  if (typeof s === 'string') s = JSON.parse(s);
  document.getElementById('sheetName').textContent  = s.name;
  document.getElementById('sheetSub').textContent   = 'Station n°' + s.shortName;
  document.getElementById('sheetBikes').textContent = s.bikes;
  document.getElementById('sheetDocks').textContent = s.docks;
  document.getElementById('sheetTotal').textContent = s.capacity;
  document.getElementById('detailOverlay').classList.add('open');
}

document.getElementById('closeSheet').onclick = () => document.getElementById('detailOverlay').classList.remove('open');
document.getElementById('detailOverlay').onclick = e => {
  if (e.target === document.getElementById('detailOverlay')) document.getElementById('detailOverlay').classList.remove('open');
};

// ── Nav tabs ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.view).classList.add('active');
    if (tab.dataset.view === 'map') leafletMap.invalidateSize();
  };
});

// ── Filters & search ──────────────────────────────────────────────────────────
document.getElementById('refreshBtn').onclick = fetchStations;
document.getElementById('searchInput').oninput = e => { searchQuery = e.target.value; renderList(); };
document.querySelectorAll('.ftab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.ftab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  activeFilter = t.dataset.filter;
  renderList();
});

// ── Boot ──────────────────────────────────────────────────────────────────────
initMap();
fetchStations();
setInterval(fetchStations, 60000);
</script>
</body>
</html>
