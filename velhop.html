<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Velhop">
<meta name="theme-color" content="#1a4a2e">
<title>Velhop — Stations</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a4a2e'/><text y='72' x='50' text-anchor='middle' font-size='62'>🚲</text></svg>">
<style>
  :root {
    --green-dark: #1a4a2e;
    --green-mid: #2d7a4f;
    --green-light: #4caf80;
    --green-pale: #e8f5ee;
    --amber: #f5a623;
    --red: #e24b4a;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --surface: #ffffff;
    --surface2: #f4f6f4;
    --border: rgba(0,0,0,0.1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --green-dark: #2d7a4f;
      --green-mid: #4caf80;
      --green-light: #7dd5a8;
      --green-pale: #0f2a1a;
      --text: #f0f0f0;
      --text-muted: #9ca3af;
      --surface: #1c1c1e;
      --surface2: #2c2c2e;
      --border: rgba(255,255,255,0.1);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    background: var(--surface2);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
  }
  header {
    background: var(--green-dark);
    color: #fff;
    padding: calc(var(--safe-top) + 14px) 16px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 600px;
    margin: 0 auto;
  }
  .logo { font-size: 26px; line-height: 1; }
  .header-title h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
  .header-title p { font-size: 12px; opacity: 0.7; margin-top: 1px; }
  .refresh-btn {
    margin-left: auto;
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 50%;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; cursor: pointer; font-size: 17px;
    transition: background 0.15s;
  }
  .refresh-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.93); }
  .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .summary-bar {
    background: var(--green-mid);
    color: #fff;
    padding: 10px 16px;
    display: flex;
    gap: 20px;
    justify-content: center;
    font-size: 13px;
  }
  .summary-bar span { opacity: 0.85; }
  .summary-bar strong { font-weight: 700; font-size: 16px; }

  .search-wrap {
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    position: sticky;
    top: calc(var(--safe-top) + 68px);
    z-index: 90;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    border: 0.5px solid var(--border);
    border-radius: 10px;
    background: var(--surface2);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  .search-icon {
    position: absolute;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .search-wrap { position: relative; }

  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1;
    min-width: 80px;
    padding: 10px 8px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tab.active {
    color: var(--green-mid);
    border-bottom-color: var(--green-mid);
  }

  .list {
    max-width: 600px;
    margin: 0 auto;
    padding: 10px 12px calc(var(--safe-bottom) + 20px);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .station-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 13px 14px;
    border: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .station-card:active { transform: scale(0.98); }
  .avail-ring {
    flex-shrink: 0;
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }
  .avail-ring svg { position: absolute; top: 0; left: 0; }
  .avail-ring .count { font-size: 18px; font-weight: 700; line-height: 1; position: relative; z-index: 1; }
  .avail-ring .label { font-size: 9px; color: var(--text-muted); position: relative; z-index: 1; text-transform: uppercase; letter-spacing: 0.3px; }
  .station-info { flex: 1; min-width: 0; }
  .station-name { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; }
  .station-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 500;
  }
  .pill-green { background: #e8f5ee; color: #1a6b3c; }
  .pill-amber { background: #fef3e2; color: #b45309; }
  .pill-red { background: #fce8e8; color: #991b1b; }
  @media (prefers-color-scheme: dark) {
    .pill-green { background: #0f2a1a; color: #7dd5a8; }
    .pill-amber { background: #2a1a00; color: #fbbf24; }
    .pill-red { background: #2a0f0f; color: #f87171; }
  }
  .station-right { flex-shrink: 0; text-align: right; }
  .docks-count { font-size: 13px; color: var(--text-muted); }
  .docks-num { font-size: 17px; font-weight: 700; color: var(--green-mid); display: block; }

  .empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty .icon { font-size: 40px; margin-bottom: 10px; }
  .empty p { font-size: 15px; }

  .loading {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 50px 20px;
    color: var(--text-muted); font-size: 15px;
  }
  .dot-pulse span {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: var(--green-mid);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
  .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }

  .timestamp { text-align: center; font-size: 11px; color: var(--text-muted); padding: 8px; }

  .detail-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .detail-overlay.open { opacity: 1; pointer-events: all; }
  .detail-sheet {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(var(--safe-bottom) + 24px);
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  .detail-overlay.open .detail-sheet { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
  .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .sheet-addr { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .sheet-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat-box { background: var(--surface2); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-box .val { font-size: 24px; font-weight: 700; }
  .stat-box .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .close-btn {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: var(--green-dark); color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 6px;
  }
  .close-btn:active { opacity: 0.85; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">🚲</div>
    <div class="header-title">
      <h1>Velhop Strasbourg</h1>
      <p>Disponibilités en temps réel</p>
    </div>
    <button class="refresh-btn" id="refreshBtn" title="Actualiser" aria-label="Actualiser">↻</button>
  </div>
</header>

<div class="summary-bar" id="summaryBar" style="display:none">
  <div><strong id="sumBikes">—</strong><span> vélos dispo.</span></div>
  <div><strong id="sumDocks">—</strong><span> places libres</span></div>
  <div><strong id="sumStations">—</strong><span> stations</span></div>
</div>

<div style="background:var(--surface); border-bottom:0.5px solid var(--border); padding:10px 16px; position:sticky; top:calc(var(--safe-top) + 68px); z-index:90;">
  <div style="position:relative; max-width:600px; margin:0 auto;">
    <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text-muted);">🔍</span>
    <input type="text" id="searchInput" placeholder="Rechercher une station…" style="width:100%;padding:10px 12px 10px 36px;border:0.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-size:15px;outline:none;">
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-filter="all">Toutes</button>
  <button class="tab" data-filter="available">Vélos dispo.</button>
  <button class="tab" data-filter="docks">Places libres</button>
  <button class="tab" data-filter="empty">Vides</button>
</div>

<div id="listContainer">
  <div class="loading">
    <div class="dot-pulse"><span></span><span></span><span></span></div>
    Chargement…
  </div>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-sheet" id="detailSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetName"></div>
    <div class="sheet-addr" id="sheetAddr"></div>
    <div class="sheet-stats">
      <div class="stat-box">
        <div class="val" id="sheetBikes" style="color:var(--green-mid)">—</div>
        <div class="lbl">🚲 Vélos</div>
      </div>
      <div class="stat-box">
        <div class="val" id="sheetDocks" style="color:var(--amber)">—</div>
        <div class="lbl">🅿️ Places</div>
      </div>
      <div class="stat-box">
        <div class="val" id="sheetTotal">—</div>
        <div class="lbl">📍 Capacité</div>
      </div>
    </div>
    <button class="close-btn" id="closeSheet">Fermer</button>
  </div>
</div>

<script>
const API = 'https://data.strasbourg.eu/api/explore/v2.1/catalog/datasets/stations-velhop/records?limit=100&offset=0';
let allStations = [];
let activeFilter = 'all';
let searchQuery = '';
let lastUpdate = null;

async function fetchStations() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  try {
    const res = await fetch(API);
    const data = await res.json();
    allStations = (data.results || []).sort((a,b) => {
      const na = (a.name || a.nom || '').toLowerCase();
      const nb = (b.name || b.nom || '').toLowerCase();
      return na.localeCompare(nb, 'fr');
    });
    lastUpdate = new Date();
    updateSummary();
    renderList();
  } catch(e) {
    document.getElementById('listContainer').innerHTML = `
      <div class="empty">
        <div class="icon">⚠️</div>
        <p>Impossible de charger les données.<br>Vérifiez votre connexion.</p>
      </div>`;
  }
  btn.classList.remove('spinning');
}

function getField(s, ...keys) {
  for (const k of keys) if (s[k] !== undefined && s[k] !== null) return s[k];
  return null;
}

function stationData(s) {
  const name = getField(s, 'name', 'nom', 'station_name', 'nom_station') || 'Station inconnue';
  const bikes = parseInt(getField(s, 'bikes', 'velos_disponibles', 'available_bikes', 'nbvelos', 'nb_velos_disponibles') ?? 0);
  const docks = parseInt(getField(s, 'docks', 'places_disponibles', 'available_docks', 'nbplaces', 'nb_places_disponibles') ?? 0);
  const total = parseInt(getField(s, 'capacity', 'capacite', 'total_docks', 'total') ?? (bikes + docks));
  return { name, bikes, docks, total };
}

function updateSummary() {
  let totalBikes = 0, totalDocks = 0;
  allStations.forEach(s => {
    const d = stationData(s);
    totalBikes += d.bikes;
    totalDocks += d.docks;
  });
  document.getElementById('sumBikes').textContent = totalBikes;
  document.getElementById('sumDocks').textContent = totalDocks;
  document.getElementById('sumStations').textContent = allStations.length;
  document.getElementById('summaryBar').style.display = 'flex';
}

function filteredStations() {
  let list = allStations;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(s => stationData(s).name.toLowerCase().includes(q));
  }
  if (activeFilter === 'available') list = list.filter(s => stationData(s).bikes > 0);
  if (activeFilter === 'docks') list = list.filter(s => stationData(s).docks > 0);
  if (activeFilter === 'empty') list = list.filter(s => stationData(s).bikes === 0);
  return list;
}

function ringColor(bikes, total) {
  if (total === 0) return '#888';
  const ratio = bikes / total;
  if (ratio >= 0.4) return '#2d7a4f';
  if (ratio > 0) return '#f5a623';
  return '#e24b4a';
}

function statusPill(bikes, docks) {
  if (bikes === 0) return `<span class="pill pill-red">Vide</span>`;
  if (bikes <= 2) return `<span class="pill pill-amber">Peu de vélos</span>`;
  if (docks === 0) return `<span class="pill pill-amber">Complet</span>`;
  return `<span class="pill pill-green">Disponible</span>`;
}

function renderList() {
  const stations = filteredStations();
  const container = document.getElementById('listContainer');
  if (stations.length === 0) {
    container.innerHTML = `<div class="empty"><div class="icon">🔍</div><p>Aucune station trouvée.</p></div>`;
    return;
  }
  const ts = lastUpdate ? `<div class="timestamp">Mis à jour à ${lastUpdate.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'})}</div>` : '';
  const cards = stations.map((s, i) => {
    const d = stationData(s);
    const color = ringColor(d.bikes, d.total);
    const pct = d.total > 0 ? (d.bikes / d.total) * 100 : 0;
    const circ = 2 * Math.PI * 22;
    const dash = (pct / 100) * circ;
    return `
    <div class="station-card" onclick="openDetail(${i})">
      <div class="avail-ring">
        <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
          <circle cx="26" cy="26" r="22" fill="none" stroke="var(--border)" stroke-width="4"/>
          <circle cx="26" cy="26" r="22" fill="none" stroke="${color}" stroke-width="4"
            stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}"
            stroke-linecap="round"
            transform="rotate(-90 26 26)"/>
        </svg>
        <span class="count" style="color:${color}">${d.bikes}</span>
        <span class="label">vélos</span>
      </div>
      <div class="station-info">
        <div class="station-name">${d.name}</div>
        <div class="station-meta">
          ${statusPill(d.bikes, d.docks)}
          <span>${d.total > 0 ? Math.round(pct) + '% plein' : ''}</span>
        </div>
      </div>
      <div class="station-right">
        <span class="docks-num">${d.docks}</span>
        <span class="docks-count">places</span>
      </div>
    </div>`;
  }).join('');
  container.innerHTML = `<div class="list">${cards}${ts}</div>`;
}

function openDetail(idx) {
  const stations = filteredStations();
  const s = stations[idx];
  const d = stationData(s);
  document.getElementById('sheetName').textContent = d.name;
  const addr = getField(s, 'address', 'adresse', 'rue', 'libelle') || '';
  document.getElementById('sheetAddr').textContent = addr || 'Strasbourg';
  document.getElementById('sheetBikes').textContent = d.bikes;
  document.getElementById('sheetDocks').textContent = d.docks;
  document.getElementById('sheetTotal').textContent = d.total;
  document.getElementById('detailOverlay').classList.add('open');
}

document.getElementById('closeSheet').addEventListener('click', () => {
  document.getElementById('detailOverlay').classList.remove('open');
});
document.getElementById('detailOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('detailOverlay'))
    document.getElementById('detailOverlay').classList.remove('open');
});

document.getElementById('refreshBtn').addEventListener('click', fetchStations);

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderList();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeFilter = tab.dataset.filter;
    renderList();
  });
});

fetchStations();
setInterval(fetchStations, 60000);
</script>
</body>
</html>
